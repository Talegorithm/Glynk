<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Glynk 账号验证码</title>
  </head>
  <body style="margin:0; padding:0; background:#f5f7fb; color:#111827; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
      你的 Glynk 验证码是 {{code}}，10 分钟内有效。
    </div>

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#f5f7fb;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:560px;">
            <tr>
              <td style="padding:0 0 16px 0;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="34" height="34" align="center" valign="middle" style="width:34px; height:34px; border-radius:10px; background:#111827; color:#ffffff; font-size:16px; line-height:34px; font-weight:700;">
                      G
                    </td>
                    <td style="padding-left:10px;">
                      <div style="font-size:19px; line-height:24px; font-weight:700; color:#111827; letter-spacing:0;">
                        Glynk
                      </div>
                      <div style="font-size:12px; line-height:18px; color:#6b7280;">
                        Agent 时代内容平台
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="background:#ffffff; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; box-shadow:0 16px 40px rgba(15,23,42,0.08);">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="padding:32px 32px 8px 32px;">
                      <div style="display:inline-block; padding:5px 10px; border-radius:999px; background:#eff6ff; color:#2563eb; font-size:12px; line-height:18px; font-weight:600;">
                        账号验证
                      </div>
                      <h1 style="margin:18px 0 10px 0; color:#111827; font-size:26px; line-height:34px; font-weight:700; letter-spacing:0;">
                        你的登录验证码
                      </h1>
                      <p style="margin:0; color:#4b5563; font-size:15px; line-height:24px;">
                        你正在使用邮箱登录 Glynk。请在登录页面输入下面的验证码，完成身份验证。
                      </p>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:24px 32px 8px 32px;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; border-collapse:separate;">
                        <tr>
                          <td align="center" style="background:#f8fafc; border:1px solid #dbeafe; border-radius:16px; padding:24px 16px;">
                            <div style="font-size:12px; line-height:18px; color:#64748b; font-weight:600; text-transform:uppercase; letter-spacing:0;">
                              Verification Code
                            </div>
                            <div style="margin-top:8px; color:#1d4ed8; font-size:34px; line-height:42px; font-weight:800; letter-spacing:8px; font-family:'SFMono-Regular','Consolas','Liberation Mono',Menlo,Courier,monospace;">
                              {{code}}
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:18px 32px 32px 32px;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#fffbeb; border:1px solid #fde68a; border-radius:12px;">
                        <tr>
                          <td style="padding:13px 14px; color:#92400e; font-size:13px; line-height:21px;">
                            验证码 10 分钟内有效。为了保护你的账号，请不要把验证码转发给任何人。
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:18px 4px 0 4px; color:#6b7280; font-size:12px; line-height:20px;">
                如果不是你本人操作，可以安全忽略这封邮件。此邮件由系统自动发送，请勿直接回复。
              </td>
            </tr>
            <tr>
              <td style="padding:12px 4px 0 4px; color:#9ca3af; font-size:12px; line-height:20px;">
                © Glynk
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
